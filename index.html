<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ground Station Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack/dist/gridstack.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./style.css"> 
</head>
<body>

    <div class="app-container" id="appContainer">
        
        <header class="topbar">
            <button class="btn-toggle-sidebar" id="btnToggleSidebar"><i class="fa-solid fa-bars"></i></button>
            <span class="app-title">Modular Telemetry Ground Station Dashboard</span>
        </header>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-content">
                
                <!-- 0. LAYOUT MANAGER -->
                <div class="section">
                    <div class="section-header" onclick="toggleSection(this)">
                        <span class="section-title">LAYOUT MANAGER</span>
                    </div>
                    <div class="section-wrapper">
                        <div class="section-inner">
                            <div class="input-group-row" style="margin-bottom:0; gap:8px;">
                                <button class="btn-layout" id="btnSaveLayout">
                                    <i class="fa-solid fa-download"></i> Save Layout
                                </button>
                                <button class="btn-layout" id="btnLoadLayout">
                                    <i class="fa-solid fa-upload"></i> Import Layout
                                </button>
                                <input type="file" id="fileInputLayout" accept=".json" style="display: none;">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 1. CONFIG -->
                <div class="section">
                    <div class="section-header active" onclick="toggleSection(this)">
                        <span class="section-title">CONFIG</span>
                    </div>
                    <div class="section-wrapper open"> 
                        <div class="section-inner">
                            <form onsubmit="return false;" class="config-form">
                                <div class="form-group"><label>COM Port</label><input type="text" id="cfg-com" placeholder="COM3" value="COM3"></div>
                                <div class="form-group"><label>Baud Rate</label><input type="text" id="cfg-baud" placeholder="115200" value="115200"></div>
                                <button class="btn-primary" id="btnConnect">Connect..</button>
                            </form>
                        </div>
                    </div>
                </div>
                
                <!-- 2. ADD WIDGET -->
                <div class="section">
                    <div class="section-header active" onclick="toggleSection(this)"><span class="section-title">ADD WIDGET</span></div>
                    <div class="section-wrapper open">
                        <div class="section-inner">
                            <div class="form-group-stack"><label>Name</label><input type="text" id="widget-name" placeholder="Widget Name"></div>
                            <div class="form-group-stack">
                                <label>Type</label>
                                <select id="widget-type">
                                    <option value="Text">Text Display</option>
                                    <option value="Graph">Graph</option>
                                    <option value="Map">Map</option>
                                    <option value="Table">Table</option>
                                </select>
                            </div>
                            <button class="btn-primary" id="btnAddWidget">Add Widget</button>
                        </div>
                    </div>
                </div>
                
                <!-- 3. SIMULATOR -->
                <div class="section">
                    <div class="section-header" onclick="toggleSection(this)"><span class="section-title">SIMULATOR</span></div>
                    <div class="section-wrapper">
                        <div class="section-inner">
                            <div class="form-group-stack"><label>Sim Input</label><textarea id="sim-input" rows="3" placeholder="25.5, 60, 1013"></textarea></div>
                            <button class="btn-action send" id="btnSend">Send Data</button>
                        </div>
                    </div>
                </div>

                <!-- 4. DATABASE (CLIENT SIDE) -->
                <div class="section">
                    <div class="section-header" onclick="toggleSection(this)">
                        <span class="section-title">DATABASE</span>
                    </div>
                    <div class="section-wrapper">
                        <div class="section-inner">
                            
                            <!-- 🆕 ปุ่ม New / Open -->
                            <div class="db-actions-row">
                                <button class="btn-db-action new" id="btnNewDbFile" title="Save As New File">
                                    <i class="fa-solid fa-file-circle-plus"></i> New File
                                </button>
                                <button class="btn-db-action open" id="btnOpenDbFile" title="Open Existing Database File">
                                    <i class="fa-solid fa-folder-open"></i> Open File
                                </button>
                            </div>

                            <div class="form-group-stack">
                                <!-- ส่วนแสดงชื่อไฟล์ -->
                                <div class="path-box display-only" id="dbPathBox" title="Click to Reveal in Explorer">
                                    <div class="path-content">
                                        <span class="db-status-led" id="dbStatusLed"></span>
                                        <span class="path-text" id="dbPathText">No file selected (Auto)</span>
                                    </div>
                                    <!-- ปุ่ม Clear (X) -->
                                    <i class="fa-solid fa-xmark path-clear-btn" id="dbClearBtn" title="Close File"></i>
                                </div>
                                
                                <div class="db-status-row">
                                    <div class="db-info-text" id="dbInfoText">Ready to Record</div>
                                </div>
                                
                                <!-- ⚠️ คำเตือน -->
                                <div class="db-warning-text" id="dbWarningText" style="display:none;">
                                    <i class="fa-solid fa-circle-exclamation"></i> <span><strong>DO NOT</strong> save the file while it is open.</span>
                                </div>
                                
                                <!-- Hidden Input for Fallback Open -->
                                <input type="file" id="dbFileInput" accept=".sqlite,.db" style="display: none;">
                            </div>

                            <button class="btn-primary" id="btnConnectDb">Start Recording</button>
                        </div>
                    </div>
                </div>

            </div>
        </aside>

        <main class="dashboard">
            <div class="grid-stack"></div>
        </main>

        <footer class="console" id="consolePanel">
            <div class="console-resizer" id="consoleResizer"></div>
            <div class="console-header">
                <img src="./icons/clear_data.png" id="btnClearConsole" class="icon-clear" alt="Clear" title="Clear Log">
            </div>
            <div class="console-output" id="consoleOutput">
                <div class="log-line" style="color:#aaa;">[SYSTEM] Initializing...</div>
            </div>
            <div class="console-input-area">
                <span class="prompt-char">></span>
                <input type="text" id="consoleInput" placeholder="Enter uplink command...">
            </div>
        </footer>

    </div>
    
    <!-- WIDGET MODAL -->
    <div class="modal-overlay" id="settingModalOverlay">
        <div class="modal-content" id="settingModalContent">
            <div class="modal-header-row">
                <div class="title-edit-wrapper">
                    <input type="text" id="modalWidgetName" class="modal-widget-name" value="Untitled" readonly title="Click to edit">
                </div>
                <button class="close-modal-btn" id="btnCloseModal"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="form-group-stack">
                <label class="modal-label-sm">Widget Type</label>
                <select id="modalWidgetType" class="modal-select">
                    <option value="Text">Text Display</option>
                    <option value="Graph">Graph</option>
                    <option value="Map">Map</option>
                    <option value="Table">Table</option>
                </select>
            </div>
            <div class="modal-divider"></div>
            <div id="modal-dynamic-inputs"></div>
            <div class="modal-footer">
                <button class="btn-delete-modal" id="btnDeleteWidget"><i class="fa-solid fa-trash-can"></i> Delete Widget</button>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/gridstack/dist/gridstack-all.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    
    <script src="./script.js"></script>
</body>
</html>
