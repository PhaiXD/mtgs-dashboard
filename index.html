<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ground Station Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack/dist/gridstack.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./style.css"> 
</head>
<body>

    <div class="app-container" id="appContainer">
        
        <header class="topbar">
            <button class="btn-toggle-sidebar" id="btnToggleSidebar"><i class="fa-solid fa-bars"></i></button>
            <span class="app-title">Modular Telemetry Ground Station Dashboard</span>
        </header>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-content">
                <div class="section">
                    <div class="section-header active" onclick="toggleSection(this)">
                        <span class="section-title">CONFIG</span>
                    </div>
                    <div class="section-wrapper open"> 
                        <div class="section-inner">
                            <form onsubmit="return false;" class="config-form">
                                <div class="form-group"><label>COM Port</label><input type="text" id="cfg-com" placeholder="COM3" value="COM3"></div>
                                <div class="form-group"><label>Baud Rate</label><input type="text" id="cfg-baud" placeholder="115200" value="115200"></div>
                                <button class="btn-primary" id="btnConnect">Connect..</button>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="section">
                    <div class="section-header active" onclick="toggleSection(this)"><span class="section-title">ADD WIDGET</span></div>
                    <div class="section-wrapper open">
                        <div class="section-inner">
                            <div class="form-group-stack"><label>Name</label><input type="text" id="widget-name" placeholder="Widget Name"></div>
                            <div class="form-group-stack">
                                <label>Type</label>
                                <select id="widget-type">
                                    <option value="Text">Text Display</option>
                                    <option value="Graph">Graph</option>
                                    <option value="Map">Map</option>
                                    <option value="Table">Table</option>
                                </select>
                            </div>
                            <button class="btn-primary" id="btnAddWidget">Add Widget</button>
                        </div>
                    </div>
                </div>
                <div class="section">
                    <div class="section-header" onclick="toggleSection(this)"><span class="section-title">SIMULATOR</span></div>
                    <div class="section-wrapper">
                        <div class="section-inner">
                            <div class="form-group-stack"><label>Sim Input</label><textarea id="sim-input" rows="3" placeholder="25.5, 60, 1013"></textarea></div>
                            <button class="btn-action send" id="btnSend">Send Data</button>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="dashboard">
            <div class="grid-stack"></div>
        </main>

        <footer class="console" id="consolePanel">
            <div class="console-resizer" id="consoleResizer"></div>
            <div class="console-header">
                <!-- 🔑 ใช้ Path ตามที่ขอ -->
                <img src="./icons/clear_data.png" id="btnClearConsole" class="icon-clear" alt="Clear" title="Clear Log">
            </div>
            <div class="console-output" id="consoleOutput">
                <div class="log-line" style="color:#aaa;">[SYSTEM] Ready.</div>
            </div>
            <div class="console-input-area">
                <span class="prompt-char">></span>
                <input type="text" id="consoleInput" placeholder="Enter uplink command...">
            </div>
        </footer>

    </div>
    
    <!-- MODAL -->
    <div class="modal-overlay" id="settingModalOverlay">
        <div class="modal-content" id="settingModalContent">
            <div class="modal-header-row">
                <div class="title-edit-wrapper">
                    <input type="text" id="modalWidgetName" class="modal-widget-name" value="Untitled" readonly>
                    <i class="fa-solid fa-pencil edit-icon" id="btnEditName"></i>
                </div>
                <button class="close-modal-btn" id="btnCloseModal"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="form-group-stack">
                <label class="modal-label-sm">Widget Type</label>
                <select id="modalWidgetType" class="modal-select">
                    <option value="Text">Text Display</option>
                    <option value="Graph">Graph</option>
                    <option value="Map">Map</option>
                    <option value="Table">Table</option>
                </select>
            </div>
            <div class="modal-divider"></div>
            <div id="modal-dynamic-inputs"></div>
            <div class="modal-footer">
                <button class="btn-delete-modal" id="btnDeleteWidget"><i class="fa-solid fa-trash-can"></i> Delete Widget</button>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/gridstack/dist/gridstack-all.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script src="./script.js"></script>
</body>
</html>
